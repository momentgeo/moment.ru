<style>

.userchip{display:flex;align-items:center;gap:7px;border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;max-width:160px;overflow:hidden}

/* MOMENT Messenger */
.chatpage{padding:16px;min-height:calc(100dvh - 170px)}
.chathead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chatlayout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;min-height:65vh}
.chatpanel{border:1px solid var(--ln);border-radius:22px;background:var(--bg);min-width:0;overflow:hidden}
.chatlist{display:flex;flex-direction:column;max-height:72vh;overflow:auto}
.chatlisttop{padding:14px;border-bottom:1px solid var(--ln);display:grid;gap:10px}
.chatitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;width:100%;min-width:0}
.chatitem:hover,.chatitem.on{background:var(--bg2)}
.chatitem.on{box-shadow:inset 3px 0 var(--ac)}
.chatitem .chatpreview{min-width:0;flex:1}
.chatpreview b,.chatpreview span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatpreview span{font-size:12px;color:var(--mu)}
.chatavatar{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#171813;font-weight:800;overflow:hidden}
.chatavatar img{width:100%;height:100%;object-fit:cover}
.chatroom{display:flex;flex-direction:column;min-height:65vh;max-height:72vh}
.chatroomhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.chatmessages{padding:16px;overflow:auto;display:flex;flex:1;flex-direction:column;gap:10px;min-height:240px}
.chatempty{margin:auto;text-align:center;max-width:320px;color:var(--mu);padding:24px}
.chatbubble{max-width:min(78%,560px);padding:10px 12px;border:1px solid var(--ln);border-radius:16px;background:var(--bg2);align-self:flex-start;overflow-wrap:anywhere}
.chatbubble.mine{align-self:flex-end;background:var(--ac);color:#171813;border-color:var(--tx)}
.chatbubble .chatmeta{display:flex;align-items:center;gap:8px;font-size:11px;opacity:.7;margin-top:5px}
.chatbubble img,.chatbubble video{display:block;max-width:min(100%,360px);max-height:280px;border-radius:12px;margin:4px 0}
.chatbubble audio{width:min(100%,300px);max-width:100%}
.chattools{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chattools button{font-size:12px;border:1px solid var(--ln);border-radius:999px;padding:3px 8px;background:var(--bg)}
.chatbubble.mine .chattools button{background:rgba(255,255,255,.5);color:#171813}
.chatcomposer{padding:12px;border-top:1px solid var(--ln);display:flex;gap:8px;align-items:flex-end}
.chatcomposer textarea{flex:1;min-width:0;min-height:44px;max-height:120px;resize:vertical;border:1px solid var(--ln);border-radius:16px;background:var(--bg2);padding:10px 12px;color:var(--tx)}
.chatcomposer .ib{background:var(--bg2);border-radius:50%;width:42px;height:42px;justify-content:center}
.chatsearchresults{display:grid;gap:4px;max-height:220px;overflow:auto}
.chatsearchresults button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px;border-radius:12px}
.chatsearchresults button:hover{background:var(--bg2)}
.chatback{display:none}
.chatbadge{font-size:10px;border-radius:99px;background:var(--co);color:#fff;padding:2px 7px}
@media(max-width:760px){.chatpage{padding:10px}.chatlayout{display:block;min-height:0}.chatlist{max-height:none}.chatroom{min-height:calc(100dvh - 210px);max-height:calc(100dvh - 160px)}.chatlayout.roomopen .chatlist{display:none}.chatlayout:not(.roomopen) .chatroom{display:none}.chatback{display:inline-flex}.chatbubble{max-width:88%}}
